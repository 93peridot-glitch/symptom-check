<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증상 체크 · 진료과 안내</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  #map{height:340px;border-radius:12px;margin-top:10px;border:1px solid var(--line)}
  .hl{background:color-mix(in srgb,var(--main) 14%,var(--card));border-radius:8px;padding:4px 8px}
  li.h{margin:6px 0;list-style:none;padding:4px 8px}
  :root{--bg:#f5f8fb;--card:#fff;--text:#1d2733;--sub:#5d6b7a;--main:#2f7be5;--warn:#d93636;--line:#e2e8ef}
  @media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222b;--text:#e8eef5;--sub:#9aa8b7;--main:#5b9cf0;--warn:#ff6b6b;--line:#2a3541}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.6}
  main{max-width:640px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:1.5rem;margin:0 0 4px}
  .sub{color:var(--sub);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  textarea{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;resize:vertical}
  button{background:var(--main);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
  button.ghost{background:transparent;color:var(--main);border:1px solid var(--main)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 12px;font-size:.85rem;margin:0;font-weight:400}
  .urgent{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
  .urgent b{color:var(--warn)}
  .dept{font-size:1.25rem;font-weight:700;color:var(--main)}
  .tag{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:.9rem}
  ul{padding-left:18px;margin:6px 0}
  a{color:var(--main)}
  .note{font-size:.82rem;color:var(--sub)}
  .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>🩺 증상 체크 · 진료과 안내</h1>
  <p class="sub">아픈 증상을 적으면 관련 가능성이 있는 질환과 방문할 진료과, 근처 병원을 알려드려요.</p>

  <div class="card">
    <label for="sym"><b>어떤 증상이 있나요?</b></label>
    <textarea id="sym" placeholder="예) 어제부터 열이 나고 목이 아프고 기침이 나요"></textarea>
    <div class="chips" id="chips"></div>
    <button id="go">분석하기</button>
  </div>

  <div id="result" class="hide"></div>

  <p class="note">※ 이 서비스는 참고용 정보이며 의사의 진단을 대신하지 않습니다. 증상이 심하거나 걱정되면 반드시 의료기관을 방문하세요. 응급 상황에는 즉시 119에 연락하세요.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  {p:["소변","오줌","요도","방광","음경","귀두"], w:[...A,...B,"가렵","가려워","붓","부어","잔뇨"], d:"비뇨의학과", c:["방광염","요도염","성매개 감염","전립선염"]},
  {p:["질이","질 입구","외음부","음부","질 쪽"], w:[...A,...B,...S], d:"산부인과", c:["질염","외음부염","바르톨린선 낭종","성매개 감염"]},
  {p:["항문","똥꼬","배변 시","배변시"], w:[...A,...B,"가렵","가려워","피","붓","부어","튀어"], d:"대장항문외과", c:["치핵","치열","항문소양증","항문 농양"]},
  {p:["눈이","눈도","눈을","눈꺼풀","눈가","눈알","눈 안","눈 속","안구"], w:[...A,...B,"가렵","가려워","붓","부어","충혈","빨갛","붉","뻑뻑","건조","눈곱","이물","침침","흐려","흐릿","피로"], d:"안과", c:["결막염","안구건조증","다래끼","각막염"]},
  {p:["귓속","귀속","귀 안","귀 뒤","귓구멍","귓바퀴","귀에","귀를","귀도","귀가"], x:/귀가(?:했|하|길|도중|후|시간)/g, w:[...A,"가렵","가려워","진물","고름","붓","부어","물이","막힌","웅웅","윙윙","소리"], d:"이비인후과", c:["중이염","외이도염","귀지 막힘","이명"]},
  {p:["코가","코도","코를","코 안","코 속","콧속","콧구멍","콧등","코끝"], w:[...A,...B,"막혀","막힌","헐","가렵","가려워","붓","부어","건조","딱지","냄새"], d:"이비인후과", c:["비염","부비동염","비강 건조/염증","코피"]},
  {p:["입안","입 안","입이","입술","혀가","혀도","혀끝","잇몸","입천장","입가","볼 안","입 속","입속"], w:[...A,...B,...S,"허옇","하얗","백태","마르","건조"], d:"치과 / 구강내과", c:["구내염","구강 칸디다","혀염","구각염"]},
  {p:["입술","입가"], w:S, d:"피부과", c:["입술염","구순포진","구각염","건조"]},
  {p:["이가","이도","이를","이빨","치아","어금니","앞니","사랑니","씹을 때","씹을때","찬물","찬 거"], w:[...A,"흔들","깨","부러","붓","부어","썩","충치","구멍"], d:"치과", c:["충치","치수염","치주염","치아 균열"]},
  // 부위 없이 피부 증상 표현만 있는 경우
  {p:null, w:["까짐","까졌","까져","까지고","까진곳","벗겨","갈라","터졌","짓무","헐었","물집","딱지","가렵","가려워","간지러","발진","각질","진물","두드러기","빨갛게","붉게","붉은"], d:"피부과", c:["접촉성/건성 피부염","찰과상","습진","두드러기"]},
];
const CHIPS=["열","기침","목 아픔","콧물","두통","어지러움","복통","설사","속쓰림","변비","허리 통증","무릎 통증","어깨 통증","피부 가려움","눈 충혈","귀 통증","치통","소변 불편","생리통","불면","피로","두근거림","입안 쓰라림","목 뻣뻣함","피부 까짐","무릎 시림","온몸 쑤심","눈 따가움","소변볼 때 쓰라림","발뒤꿈치 갈라짐"];

const $=id=>document.getElementById(id);
const sym=$("sym");
CHIPS.forEach(t=>{const b=document.createElement("button");b.className="chip";b.textContent="+ "+t;
  b.onclick=()=>{sym.value=(sym.value?sym.value.trim()+", ":"")+t};$("chips").appendChild(b)});

function analyze(text){
  // 띄어쓰기 차이를 무시하고 비교 ("가슴이 아파" = "가슴이아파")
  const t=text.replace(/\s+/g,"");
  const norm=w=>w.replace(/\s+/g,"");
  const hits=RULES.map(r=>({r,n:r.k.filter(w=>t.includes(norm(w))).length})).filter(x=>x.n>0);
  // 부위 × 통증표현 조합: 부위가 있고 통증/증상 표현이 함께 있어야 인정
  BODY.forEach(e=>{
    const tt=e.x?t.replace(e.x,""):t;
    if(!e.w.some(w=>tt.includes(norm(w))))return;
    const pm=e.p?e.p.filter(w=>tt.includes(norm(w))).length:1;
    if(!pm)return;
    hits.push({r:{c:e.c,d:e.d,urgent:false},n:e.p?1+pm:1});
  });
  hits.sort((a,b)=>(b.r.urgent?1:0)-(a.r.urgent?1:0)||b.n-a.n);
  // 같은 진료과는 하나로 합치고 질환을 병합 (응급 여부는 하나라도 응급이면 응급)
  // 진료과가 다른 쪽의 부분집합이면 같은 진료과로 보고 합침 ("정형외과" ⊂ "정형외과 / 신경외과")
  const toks=d=>d.split("/").map(s=>s.trim());
  const sub=(a,b)=>a.every(x=>b.includes(x));
  const list=[];
  hits.forEach(({r,n})=>{
    const rt=toks(r.d);
    const m=list.find(m=>sub(rt,m.t)||sub(m.t,rt));
    if(!m){list.push({...r,c:[...r.c],score:n,t:rt});return}
    m.score+=n;m.urgent=m.urgent||r.urgent;
    r.c.forEach(c=>{if(!m.c.includes(c))m.c.push(c)});
    if(rt.length>m.t.length){m.d=r.d;m.t=rt}
  });
  return list.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||b.score-a.score);
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("go").onclick=()=>{
  const text=sym.value.trim(); if(!text)return;
  const res=analyze(text), box=$("result"); box.classList.remove("hide");
  if(!res.length){
    box.innerHTML=`<div class="card"><b>증상을 정확히 파악하기 어려워요.</b><br>다른 표현으로 더 구체적으로 적어주세요. 잘 모르겠다면 <b>가정의학과/내과</b> 방문을 권해요.</div>`;
    return;
  }
  const urgent=res.some(r=>r.urgent);
  let html="";
  if(urgent) html+=`<div class="card urgent"><b>⚠ 응급 가능성이 있는 증상이 포함돼 있어요.</b><br>증상이 갑자기 시작됐거나 심하다면 지체하지 말고 <b>119</b>에 연락하거나 가까운 응급실로 가세요.</div>`;
  res.slice(0,3).forEach((r,i)=>{
    html+=`<div class="card"><div class="note">${i==0?"가장 관련 있는 진료과":"함께 고려할 진료과"}</div>
      <div class="dept">${esc(r.d)}</div>
      <div style="margin-top:8px"><span class="note">가능성 있는 질환 (참고용)</span><br>${r.c.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div></div>`;
  });
  const deptStr=res[0].d;
  html+=`<div class="card"><b>📍 반경 1km 이내 병원</b>
    <div class="note">'${esc(deptStr)}' 진료과 병원을 우선 표시해요. 위치 권한을 허용해 주세요.</div>
    <button id="loc">내 주변 1km 병원 보기</button>
    <div id="map" class="hide"></div>
    <div id="hosp"></div></div>`;
  box.innerHTML=html;
  $("loc").onclick=()=>findHospitals(deptStr);
  box.scrollIntoView({behavior:"smooth"});
};

function mapLinks(q,lat,lng){
  const e=encodeURIComponent(q);
  const kakao=lat?`https://map.kakao.com/link/search/${e}`:`https://map.kakao.com/link/search/${e}`;
  return `<p><a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${e}">네이버지도에서 '${esc(q)}' 검색</a> ·
  <a target="_blank" rel="noopener" href="${kakao}">카카오맵에서 검색</a></p>`;
}

let map=null;
function deptKeywords(d){
  const ks=d.split(/[\/()]/).map(s=>s.trim()).filter(Boolean).map(s=>s==="응급실"?"응급":s);
  ks.forEach(k=>{if(k.endsWith("내과"))ks.push("내과")});
  return [...new Set(ks)];
}
function findHospitals(deptStr){
  const out=$("hosp"), mapEl=$("map"), R=1000;
  const main=deptStr.split("/")[0].trim().replace(/\(.*\)/,"");
  out.innerHTML="위치 확인 중...";
  if(!navigator.geolocation){out.innerHTML=mapLinks("근처 "+main);return}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng}=pos.coords;
    out.innerHTML="반경 1km 병원 검색 중...";
    mapEl.classList.remove("hide");
    if(map){map.remove()}
    map=L.map(mapEl).setView([lat,lng],15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
    const circle=L.circle([lat,lng],{radius:R,color:"#2f7be5",fillOpacity:.07}).addTo(map);
    L.marker([lat,lng]).addTo(map).bindPopup("현재 위치");
    map.fitBounds(circle.getBounds());
    const q=`[out:json][timeout:25];(nwr["amenity"~"hospital|clinic|doctors"](around:${R},${lat},${lng});nwr["healthcare"](around:${R},${lat},${lng}););out center 80;`;
    try{
      const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
      const j=await r.json();
      const rad=x=>x*Math.PI/180, keys=deptKeywords(deptStr), seen=new Set();
      const items=j.elements.filter(e=>e.tags&&e.tags.name).map(e=>{
        const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon;
        const dx=(lo-lng)*111320*Math.cos(rad(lat)), dy=(la-lat)*110540;
        const name=e.tags.name, match=keys.some(k=>name.includes(k)||(e.tags["healthcare:speciality"]||"").includes(k));
        return {name,dist:Math.round(Math.hypot(dx,dy)),la,lo,match};
      }).filter(i=>i.dist<=R&&!seen.has(i.name)&&seen.add(i.name))
        .sort((a,b)=>(b.match-a.match)||a.dist-b.dist);
      items.forEach(i=>L.marker([i.la,i.lo],{opacity:i.match?1:.55}).addTo(map).bindPopup(`<b>${esc(i.name)}</b><br>${i.dist}m`));
      let h=items.length?`<p class="note">총 ${items.length}곳 · 파란 배경은 '${esc(main)}' 관련 병원</p><ul style="padding:0">${items.map(i=>`<li class="h ${i.match?"hl":""}"><a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(i.name)}">${esc(i.name)}</a> <span class="note">${i.dist}m${i.match?" · "+esc(main)+" 추정":""}</span></li>`).join("")}</ul>`
        :`<p class="note">반경 1km 안에서 지도 데이터를 찾지 못했어요.</p>`;
      h+=`<p class="note">무료 지도(OpenStreetMap) 데이터라 일부 병원이 빠졌거나 진료과가 정확하지 않을 수 있어요. 방문 전 꼭 확인하세요.</p>`+mapLinks("근처 "+main,lat,lng);
      out.innerHTML=h;
    }catch(e){out.innerHTML=`<p class="note">병원 목록을 불러오지 못했어요.</p>`+mapLinks("근처 "+main)}
  },()=>{out.innerHTML=`<p class="note">위치 권한이 없어 지도 검색 링크로 안내해요.</p>`+mapLinks("근처 "+main)},{timeout:10000});
}
